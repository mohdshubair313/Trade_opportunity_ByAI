[pytest]
# ── Core Settings ──────────────────────────────────────────────────────────
minversion = 8.0
asyncio_mode = auto
addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes
    -p no:warnings

# ── Markers ───────────────────────────────────────────────────────────────
markers =
    unit:           Isolated unit tests (no DB / no HTTP)
    integration:    Tests that hit the real FastAPI app + SQLite
    e2e:            Full-stack tests (frontend + backend)
    slow:           Tests that take > 2 seconds (e.g., real AI calls)
    requires_api_key: Tests that require a real external API key
    flaky:          Known flaky tests — run with retries

# ── Logging ────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s

# ── Warnings Filter ───────────────────────────────────────────────────────
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
